# Local development stack: the CLI image plus a single-node Kafka broker.
#
# NOT VERIFIED BY EXECUTION. No Docker daemon is reachable in the environment
# this was authored in, so `docker compose up` has not been run against it. The
# YAML is schema-valid and the Kafka settings follow the documented single-node
# KRaft pattern for the official apache/kafka image, but treat first use as a
# bring-up rather than a regression.
#
# The Kafka service exists because ingestion/source.py ships a real
# KafkaEventSource (confluent-kafka, manual-commit at-least-once, EOF-aware
# replay) which the unit suite exercises against a mock. What a mock cannot
# establish -- real offset-commit semantics, throughput, back-pressure under
# load -- is what this broker is for; scripts/validate_streaming.py is the
# harness that measures it once a broker is reachable.

services:
  ueba-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ueba-pipeline:dev
    volumes:
      - model-artifacts:/app/artifacts
      - ../enterprise_simulator/output:/app/data:ro
    environment:
      - UEBA__MODEL_STORE_PATH=/app/artifacts/models
      # Required: the engine refuses to sign or load a bundle without it.
      - UEBA__SECURITY__MODEL_SIGNING_KEY=${UEBA__SECURITY__MODEL_SIGNING_KEY:?set this to 32+ random bytes}
    depends_on:
      kafka:
        condition: service_healthy
    # This image is a CLI, not a daemon, so it has no long-running command.
    # Invoke it as:
    #   docker compose run ueba-pipeline train \
    #       --data-dir /app/data --model-dir /app/artifacts/models/engine
    command: ["--help"]

  kafka:
    # SECURITY: these listeners are PLAINTEXT and this file is the LOCAL DEV
    # loop ONLY. It must never carry real identity or security telemetry on an
    # untrusted network. For any shared or production broker use
    # docker-compose.prod.yml, which requires SASL_SSL and mTLS.
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  model-artifacts:
  kafka-data:
