# Production hardening overlay for the Kafka broker (AUDIT finding #7).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Replaces the base file's PLAINTEXT listeners with SASL_SSL so the broker never
# carries identity/security telemetry in cleartext. TLS material and SASL
# credentials are provided out of band (mounted secrets / external secret
# manager), never committed. This is the documented target configuration;
# validate certificate paths and SCRAM provisioning against your cluster before
# rollout.
services:
  kafka:
    environment:
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,SASL_SSL://0.0.0.0:19092,SASL_SSL_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:19092,SASL_SSL_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL,SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
  ueba-pipeline:
    # NOTE: PipelineConfig has no `ingestion` section and every model is
    # extra="forbid", so the previous UEBA__INGESTION__* vars here crashed the
    # process at config load (reproduced: ValidationError "ingestion — Extra
    # inputs are not permitted"). KafkaEventSource already accepts these via its
    # `extra_config` dict; pass them there instead of through PipelineConfig.
    environment:
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=SCRAM-SHA-512
