# Provisioning the UEBA model signing key as a Kubernetes Secret.
#
# The key HMAC-signs model bundles and is verified on load (persistence/store.py).
# It must be identical across retrains (it verifies previously written bundles)
# and must never live in git or the container image.
#
# Preferred pattern: the External Secrets Operator syncs the key from a real
# vault (AWS Secrets Manager / Azure Key Vault / GCP Secret Manager / Vault) into
# the `ueba-signing-key` Secret the CronJob consumes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ueba-signing-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: org-secret-store
    kind: ClusterSecretStore
  target:
    name: ueba-signing-key
    creationPolicy: Owner
  data:
    - secretKey: model-signing-key
      remoteRef:
        key: ueba/model-signing-key
---
# Fallback without External Secrets Operator -- create imperatively from a value
# held outside git; do NOT commit a populated Secret:
#
#   kubectl create secret generic ueba-signing-key \
#     --from-literal=model-signing-key="$(cat /secure/host-only.key)"
