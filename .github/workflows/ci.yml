name: CI

# Every claim this repository makes should be checkable by someone who is not
# the author. That is what this workflow is for: it runs the same commands the
# README documents, on a machine nobody has configured by hand.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here writes to the repository, publishes a
# package, or comments on a pull request, so read access to contents is all any
# of them gets. A job that later needs more must ask for it explicitly.
permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The package lives one level down from the repository root.
    working-directory: ueba-pipeline

# Third-party actions below are pinned to full commit SHAs rather than tags: a
# tag is a movable pointer, and moving it is the mechanism behind the GitHub
# Actions supply-chain compromises of recent years. The trailing comment records
# which release each SHA was, so Dependabot can propose bumps and a human can
# read the diff. SHAs resolved with `git ls-remote` against the upstream
# repositories. (`uses:` cannot take an expression, so these cannot be hoisted
# into a variable — the SHA is repeated per job on purpose.)

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ueba-pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One failing interpreter should not hide the result on the other.
      fail-fast: false
      matrix:
        # 3.12 is the declared floor and the version the container image is
        # built on; 3.13 is tested so that a floor bump is a decision rather
        # than a surprise.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ueba-pipeline/pyproject.toml

      # [dev] deliberately excludes [benchmark]. Installing only what the suite
      # needs is itself a test: if a lazily-imported optional dependency ever
      # leaks onto the detection path, this job is where it shows up.
      - run: pip install -e ".[dev]"

      - name: Run the suite
        env:
          # The engine refuses to run without a signing key and never defaults
          # one. CI mints an ephemeral key per run rather than reading a repo
          # secret: the key only has to exist for the length of the job, and a
          # test key that is never stored is a test key that cannot leak.
          UEBA__SECURITY__MODEL_SIGNING_KEY: ${{ github.run_id }}${{ github.run_attempt }}
        run: pytest

  end-to-end:
    name: quickstart end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ueba-pipeline/pyproject.toml
      - run: pip install -e ".[dev]"

      # The README's quickstart is a promise. Unit tests do not check that the
      # simulator, the trainer, the scorer and the evaluator still compose, and
      # a documented command that no longer runs is a defect. Three days rather
      # than twenty keeps this under a minute; the published figures are
      # measured separately over six 20-day estates.
      - name: Generate an estate
        run: |
          python enterprise_simulator/run_simulation.py --days 3 --seed 20250106 \
            --quiet --inject-attacks headline --attack-count 4 --attack-placement spread

      - name: Train, score, evaluate
        env:
          UEBA__SECURITY__MODEL_SIGNING_KEY: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          ueba train --data-dir enterprise_simulator/output \
            --model-dir artifacts/models/ci
          ueba score --data-dir enterprise_simulator/output \
            --model-dir artifacts/models/ci --alert-budget-per-day 5
          ueba walk-forward-eval --data-dir enterprise_simulator/output \
            --contamination none

  package:
    name: build + install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
          python-version: "3.12"

      # Building the wheel and installing it into a clean environment is the
      # only way to catch a package that works from a source checkout and is
      # broken once distributed -- a missing subpackage, a console script that
      # points at nothing.
      - run: pip install build && python -m build
      - name: Install the built wheel into a clean venv and run the CLI
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/ueba --help

  image:
    name: container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1

      # Build only -- nothing is pushed to a registry, so this job needs no
      # credentials and no write permission. It exists because the Dockerfile
      # installs the package from pyproject.toml, and nothing else here would
      # notice if that stopped working.
      - name: Build
        run: docker build -f docker/Dockerfile -t ueba-pipeline:ci .
      - name: The entrypoint runs
        run: docker run --rm ueba-pipeline:ci --help
